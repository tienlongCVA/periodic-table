<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIẾN TRÚC SƯ NGUYÊN TỬ</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-glow: rgba(0, 242, 255, 0.5);
            --bg-dark: #0a0f1a;
            --nucleus-red: #ff4757;
        }

        body {
            margin: 0; background: var(--bg-dark); color: white;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; height: 100vh;
        }

        .stars-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }

        h1 { text-shadow: 0 0 15px var(--neon-cyan); margin: 15px 0 5px; color: var(--neon-cyan); letter-spacing: 2px; }
        #mission { font-size: 1.1rem; color: #fff; background: rgba(0, 242, 255, 0.1); padding: 8px 25px; border-radius: 30px; border: 1px solid var(--neon-cyan); text-align: center; }

        .container { display: flex; width: 95%; max-width: 1100px; height: 65vh; gap: 20px; margin-top: 15px; }

        .sidebar {
            width: 240px; border: 2px solid var(--neon-cyan); border-radius: 15px;
            padding: 15px; background: rgba(0, 242, 255, 0.05);
            display: flex; flex-direction: column; box-shadow: 0 0 15px var(--neon-glow);
        }
        .electron-bin {
            flex-grow: 1; border: 1px dashed var(--neon-cyan); border-radius: 10px;
            display: flex; flex-wrap: wrap; align-content: flex-start;
            gap: 10px; padding: 15px; overflow-y: auto; background: rgba(0,0,0,0.3); margin-top: 10px;
        }

        #input-zone { margin-top: 15px; text-align: center; }
        #z-answer {
            background: rgba(0,0,0,0.5); border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 10px; width: 80%;
            font-size: 1.5rem; text-align: center; border-radius: 8px;
        }

        .game-area {
            flex-grow: 1; border: 2px solid var(--neon-cyan); border-radius: 15px;
            position: relative; background: rgba(0, 0, 0, 0.4);
            display: flex; justify-content: center; align-items: center;
        }

        .element-info { position: absolute; top: 15px; right: 20px; text-align: right; z-index: 300; }
        #el-name { font-size: 1.8rem; font-weight: bold; color: var(--neon-cyan); text-transform: uppercase; }
        
        .reset-player-btn {
            position: absolute; top: 15px; left: 15px; z-index: 300;
            padding: 10px 18px; background: var(--nucleus-red);
            border: none; color: white; border-radius: 5px;
            cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: 0.3s;
        }

        .atom-display { position: relative; width: 450px; height: 450px; }
        .nucleus {
            position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
            background: radial-gradient(circle, #ff6b6b, var(--nucleus-red));
            border-radius: 50%; transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 1.6rem; box-shadow: 0 0 30px var(--nucleus-red); z-index: 200;
        }

        .orbit {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 1.5px solid rgba(0, 242, 255, 0.2); border-radius: 50%;
        }
        .orbit[data-idx="0"] { width: 140px; height: 140px; z-index: 100; }
        .orbit[data-idx="1"] { width: 230px; height: 230px; z-index: 90; }
        .orbit[data-idx="2"] { width: 320px; height: 320px; z-index: 80; }
        .orbit[data-idx="3"] { width: 410px; height: 410px; z-index: 70; }

        .orbit.over { border: 3px solid var(--neon-cyan); background: rgba(0, 242, 255, 0.1); }

        /* --- ANIMATION ELECTRON --- */
        .electron {
            width: 20px; height: 20px; background: var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 12px var(--neon-cyan);
            cursor: grab;
            /* Animation mượt khi thay đổi vị trí */
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 0.3s ease;
        }
        
        .electron.system-init { 
            background: #fff; 
            box-shadow: 0 0 15px #fff; 
            border: 2px solid #ccc;
        }

        .orbit .electron { 
            position: absolute; 
            transform: translate(-50%, -50%); 
            z-index: 150; 
            pointer-events: none;
        }

        /* Hiệu ứng xuất hiện mới */
        @keyframes spawn {
            from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .orbit .electron { animation: spawn 0.4s ease-out; }

        .orbit .electron.interactable { pointer-events: auto !important; }
        .electron-bin .electron { pointer-events: auto; animation: none; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #0a0f1a; border: 3px solid var(--neon-cyan); border-radius: 20px; padding: 40px; text-align: center; }
        .btn-container { margin-top: 25px; display: flex; gap: 10px; }
        button.main-btn { padding: 12px 30px; background: transparent; border: 2px solid var(--neon-cyan); color: var(--neon-cyan); border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .back-btn {
            z-index: 99;
            position: absolute;
            left: 52px;
            top: 50px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #ff4d4d;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(255,0,0,0.6);
            }
        .back-btn:hover {
            background: #ff1a1a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="stars-bg"></div>
    <h1>KIẾN TRÚC SƯ NGUYÊN TỬ</h1>
    <p id="mission">...</p>
    <button class="back-btn" onclick="window.location.href='../index.html';">Trang chủ</button>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <h3 style="margin:0; color: var(--neon-cyan); text-align: center;">KHO HẠT</h3>
            <div class="electron-bin" id="bin"></div>
            <div id="input-zone" style="display: none;">
                <p>Nhập số hiệu nguyên tử (Z):</p>
                <input type="number" id="z-answer" placeholder="?">
            </div>
        </div>

        <div class="game-area">
            <button class="reset-player-btn" id="recall-btn" onclick="recallPlayerElectrons()">THU HỒI HẠT XANH</button>
            <div class="element-info">
                <div id="el-name">???</div>
                <div id="el-symbol">???</div>
            </div>
            <div class="atom-display">
                <div class="nucleus" id="nucleus">+0</div>
                <div id="orbits-container">
                    <div class="orbit" data-idx="0"></div>
                    <div class="orbit" data-idx="1"></div>
                    <div class="orbit" data-idx="2"></div>
                    <div class="orbit" data-idx="3"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="btn-container">
        <button class="main-btn" onclick="check()">XÁC NHẬN</button>
        <button class="main-btn" onclick="nextLevel()" style="border-color:#fff; color:#fff;">TIẾP THEO</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <h2 id="modal-title"></h2>
            <p id="modal-msg"></p>
            <button class="main-btn" onclick="closeModal()">TIẾP TỤC</button>
        </div>
    </div>

    <script>
        let elements = [];
        let current = null;
        let mode = 1;

        fetch('game.json').then(r => r.json()).then(data => {
            elements = data;
            nextLevel();
        });

        function nextLevel() {
            current = elements[Math.floor(Math.random() * elements.length)];
            mode = Math.floor(Math.random() * 3) + 1;
            
            document.getElementById('z-answer').value = '';
            document.getElementById('input-zone').style.display = (mode === 2) ? 'block' : 'none';
            document.getElementById('bin').style.display = (mode === 2) ? 'none' : 'flex';
            document.getElementById('recall-btn').style.display = (mode === 2) ? 'none' : 'block';

            const orbits = document.querySelectorAll('.orbit');
            orbits.forEach(o => { o.innerHTML = ''; o.style.display = 'none'; });

            const nuc = document.getElementById('nucleus');
            const infoName = document.getElementById('el-name');
            const infoSym = document.getElementById('el-symbol');

            if (mode === 1) {
                document.getElementById('mission').innerText = `Xây dựng cấu hình Electron cho Z = ${current.z}`;
                nuc.innerText = "+" + current.z;
                infoName.innerText = "???"; infoSym.innerText = "Ký hiệu: ???";
                orbits.forEach(o => o.style.display = 'block');
            } 
            else if (mode === 2) {
                document.getElementById('mission').innerText = `Đếm hạt và đoán số hiệu nguyên tử Z`;
                nuc.innerText = "+?";
                infoName.innerText = "???"; infoSym.innerText = "Ký hiệu: ???";
                current.shells.forEach((_, i) => orbits[i].style.display = 'block');
                fillElectrons(true);
            }
            else {
                document.getElementById('mission').innerText = `Sửa lỗi cấu hình của ${current.name} (Z = ${current.z})`;
                nuc.innerText = "+" + current.z;
                infoName.innerText = current.name;
                infoSym.innerText = `Ký hiệu: ${current.symbol}`;
                current.shells.forEach((_, i) => orbits[i].style.display = 'block');
                fillElectrons(false);
            }

            const bin = document.getElementById('bin');
            bin.innerHTML = '';
            if (mode !== 2) {
                for(let i=0; i<25; i++) createElectron(`e-user-${i}`, bin, false);
            }
            
            initDragEvents();
            setTimeout(updateAll, 50);
        }

        function createElectron(id, parent, isSystem) {
            const e = document.createElement('div');
            e.id = id;
            e.className = 'electron' + (isSystem ? ' system-init' : ' player-added interactable');
            if(isSystem && mode === 3) e.classList.add('interactable');
            e.draggable = e.classList.contains('interactable');

            e.addEventListener('dragstart', (ev) => {
                ev.dataTransfer.setData("text", ev.target.id);
                ev.target.style.transition = "none"; // Tắt transition khi đang kéo
                setTimeout(() => ev.target.style.opacity = "0.5", 0);
            });
            e.addEventListener('dragend', (ev) => {
                ev.target.style.transition = ""; // Bật lại transition khi thả
                ev.target.style.opacity = "1";
            });
            
            parent.appendChild(e);
        }

        function fillElectrons(isCorrect) {
            const orbits = document.querySelectorAll('.orbit');
            current.shells.forEach((count, i) => {
                let finalCount = isCorrect ? count : Math.max(1, count + (Math.random() > 0.5 ? 1 : -1));
                for(let j=0; j<finalCount; j++) createElectron(`e-sys-${i}-${j}`, orbits[i], true);
            });
        }

        function recallPlayerElectrons() {
            const bin = document.getElementById('bin');
            document.querySelectorAll('.orbit .electron.player-added').forEach(el => {
                el.style.cssText = ""; 
                bin.appendChild(el);
            });
            updateAll();
        }

        function initDragEvents() {
            document.querySelectorAll('.orbit').forEach(orb => {
                orb.ondragover = (e) => { e.preventDefault(); orb.classList.add('over'); };
                orb.ondragleave = () => orb.classList.remove('over');
                orb.ondrop = (e) => {
                    e.preventDefault();
                    orb.classList.remove('over');
                    const id = e.dataTransfer.getData("text");
                    const el = document.getElementById(id);
                    if(el) { orb.appendChild(el); updateAll(); }
                };
            });

            const sidebar = document.getElementById('sidebar');
            sidebar.ondragover = (e) => e.preventDefault();
            sidebar.ondrop = (e) => {
                e.preventDefault();
                const id = e.dataTransfer.getData("text");
                const el = document.getElementById(id);
                if(el) { 
                    el.style.cssText = ""; 
                    document.getElementById('bin').appendChild(el); 
                    updateAll(); 
                }
            };
        }

        function updateAll() {
            document.querySelectorAll('.orbit').forEach(reposition);
        }

        function reposition(orb) {
            const es = orb.querySelectorAll('.electron');
            if(es.length === 0) return;
            const r = orb.offsetWidth / 2;
            const step = 360 / es.length;
            es.forEach((e, i) => {
                const rad = (step * i) * (Math.PI / 180);
                e.style.left = (r + r * Math.cos(rad)) + 'px';
                e.style.top = (r + r * Math.sin(rad)) + 'px';
            });
        }

        function check() {
            let isCorrect = false;
            let msg = "";

            if (mode === 2) {
                isCorrect = (parseInt(document.getElementById('z-answer').value) === current.z);
                msg = isCorrect ? `Đúng! Z=${current.z} là ${current.name}.` : `Sai rồi! Z=${current.z} mới đúng.`;
            } else {
                const orbits = document.querySelectorAll('.orbit');
                let userConfig = [];
                for(let i=0; i < current.shells.length; i++) {
                    userConfig.push(orbits[i].querySelectorAll('.electron').length);
                }
                let extra = 0;
                for(let i=current.shells.length; i<4; i++) extra += orbits[i].querySelectorAll('.electron').length;

                isCorrect = (JSON.stringify(userConfig) === JSON.stringify(current.shells)) && extra === 0;
                msg = isCorrect ? `Giỏi lắm! Bạn đã xếp đúng cấu hình.` : `Chưa đúng! Đáp án: ${current.shells.join('-')}`;
            }

            const title = document.getElementById('modal-title');
            title.innerText = isCorrect ? "CHÍNH XÁC! 🎉" : "THỬ LẠI XEM! ❌";
            title.style.color = isCorrect ? "var(--neon-cyan)" : "#ff6b6b";
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('overlay').style.display = 'none';
            if(document.getElementById('modal-title').innerText.includes("CHÍNH XÁC")) nextLevel();
        }
    </script>
</body>
</html>
